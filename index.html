    .weekday,.week-axis-head,.week-time-label,.week-graph-total,.cal-count,.week-unscheduled-label{color:var(--muted)}.cal-day{background:#121d24;color:var(--ink);border-color:var(--line)}.cal-day:hover,.cal-day.selected{background:#1a2b31;border-color:#6f9e8c}.cal-day.muted{background:#101820;color:#64737b}.cal-day.today .day-num{background:#a4d2c0;color:#102019}.week-day.today,.week-graph-heading.today{background:#192a2d;border-color:#5e887a}.week-graph-heading,.week-day-column{background-color:#121d24}.week-day-column.today{background-color:#172629}.week-graph-add{background:#19282e;color:#b7e1cf;border-color:#34474b}.week-unscheduled-grid{background:#101a21}.week-unassigned{background:#17242b;color:#c3d0d5;border-color:#34464f}.week-no-unassigned{color:#788991}.week-event.fixed{background:#66747a}.week-event.conflict{outline-color:var(--red)}
    .day-summary{grid-template-columns:repeat(3,minmax(0,1fr))}.mini-stat{background:#101a21;border-color:var(--line)}.schedule-item.fixed{background:#17232a}.schedule-item.conflict{background:var(--red-soft);border-color:#79434a}.warning{background:var(--amber-soft);color:#e4c780}.warning.red{background:var(--red-soft);color:#f0a1a6}.pill{background:#202d34;color:#c4cfd3}.pill.blue{background:#1d302e;color:#b1decb}.pill.green{background:#19382e;color:#8ed4b6}.pill.red{background:#3b2429;color:#f0a0a5}
    .modal-backdrop{background:rgba(3,8,11,.72);backdrop-filter:blur(5px)}.modal-card{background:#121d24;border:1px solid #30414a;box-shadow:0 25px 90px rgba(0,0,0,.5)}.modal-head h2{color:var(--ink)}.modal-close{background:#213039;color:#d2dcdf}.segmented{background:#0e171d}.segmented button.active{background:#24343a;color:#b5dfcd;box-shadow:none}.notice{background:#1c302e;color:#b3dccb}.toast{background:#e4eee9;color:#13201a}
    @media(max-width:700px){.mobile-nav{background:rgba(12,19,24,.95);backdrop-filter:blur(18px)}.day-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-actions{align-items:flex-start}.hero-link{font-size:12px}}

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">오</div><div><div class="brand-title">오늘공부</div><div class="brand-sub">나만의 수능 플래너</div></div></div>
      <nav class="nav-list" aria-label="주요 화면">
        <button class="nav-btn" data-page="home"><span class="nav-icon">⌂</span>오늘</button>
        <button class="nav-btn" data-page="month"><span class="nav-icon">▦</span>월간 계획</button>
        <button class="nav-btn" data-page="week"><span class="nav-icon">▤</span>주간 계획</button>
        <button class="nav-btn" data-page="day"><span class="nav-icon">☷</span>일간 시간표</button>
        <button class="nav-btn" data-page="settings"><span class="nav-icon">⚙</span>과목 및 설정</button>
      </nav>
      <div class="side-note"><b>내 태블릿에 저장됩니다</b>인터넷 없이도 계획을 확인하고 수정할 수 있어요.</div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><div class="eyebrow" id="pageEyebrow">오늘의 계획</div><h1 class="page-heading" id="pageTitle">오늘 공부할 것</h1></div>
        <div class="top-actions"><span class="today-chip" id="headerDate"></span><button class="btn soft" id="installBtn" hidden>앱 설치</button></div>
      </header>
      <section id="pageView" class="page"></section>
    </main>
    <nav class="mobile-nav" aria-label="주요 화면">
      <button class="nav-btn" data-page="home"><span class="nav-icon">⌂</span>오늘</button>
      <button class="nav-btn" data-page="month"><span class="nav-icon">▦</span>월간</button>
      <button class="nav-btn" data-page="week"><span class="nav-icon">▤</span>주간</button>
      <button class="nav-btn" data-page="day"><span class="nav-icon">☷</span>일간</button>
      <button class="nav-btn" data-page="settings"><span class="nav-icon">⚙</span>설정</button>
    </nav>
  </div>
  <div class="modal-backdrop" id="modal" role="dialog" aria-modal="true"><div class="modal-card" id="modalBody"></div></div>
  <div class="toast" id="toast" role="status"></div>
  <script>
  (() => {
    'use strict';
    const KEY = 'oneul-study-planner-v1';
    const weekdays = ['일','월','화','수','목','금','토'];
    const colors = ['#6878df','#2a9d80','#e39c42','#c7688b','#4a99c3','#8a70c5','#9b8c53'];
    const fresh = () => ({
      settings:{examDate:'2027-11-18',availability:[0,0,0,0,0,0,0],fixed:[],pomoFocus:25,pomoBreak:5},
      subjects:[],months:{},weeks:{},tasks:[],dayOverrides:{},study:{totals:{},runningAt:null},
      pomo:{phase:'focus',running:false,endsAt:null,remainingMs:null,cycles:0}
    });
    function load(){try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(!raw)return fresh();const base=fresh();return {...base,...raw,settings:{...base.settings,...(raw.settings||{})},study:{...base.study,...(raw.study||{})},pomo:{...base.pomo,...(raw.pomo||{})},dayOverrides:raw.dayOverrides&&typeof raw.dayOverrides==='object'&&!Array.isArray(raw.dayOverrides)?raw.dayOverrides:{}}}catch(_){return fresh()}}
    let state = load();
    let page = 'home';
    let selectedDate = keyOf(new Date());
    let monthShowing = selectedDate.slice(0,7);
    let deferredInstall = null;
    const $ = s => document.querySelector(s);
    const esc = v => String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(_){toast('저장 공간을 사용할 수 없습니다. 브라우저 설정을 확인해 주세요.')}}
    function keyOf(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
    function fromKey(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
    function addDays(k,n){const d=fromKey(k);d.setDate(d.getDate()+n);return keyOf(d)}
    function monthKey(k){return k.slice(0,7)}
    function mondayKey(k){const d=fromKey(k);return addDays(k,-((d.getDay()+6)%7))}
    function dateLabel(k,withYear=true){const d=fromKey(k);return `${withYear?`${d.getFullYear()}년 `:''}${d.getMonth()+1}월 ${d.getDate()}일 (${weekdays[d.getDay()]})`}
    function monthLabel(k){const [y,m]=k.split('-').map(Number);return `${y}년 ${m}월`}
    function hours(min){const h=Math.floor(min/60),m=min%60;return h?`${h}시간${m?` ${m}분`:''}`:`${m}분`}
    function clock(sec){sec=Math.max(0,Math.floor(sec));return `${String(Math.floor(sec/3600)).padStart(2,'0')}:${String(Math.floor(sec%3600/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
    function shortClock(sec){sec=Math.max(0,Math.floor(sec));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
    function timeMin(t){if(!t)return null;const [h,m]=t.split(':').map(Number);return h*60+m}
    function taskMinutes(t){if(t.start&&t.end){let a=timeMin(t.start),b=timeMin(t.end);if(b<a)b+=1440;return b-a}return Math.max(0,Number(t.estimate)||0)}
    function allOn(k){return state.tasks.filter(t=>t.date===k).sort((a,b)=>(a.start||'99:99').localeCompare(b.start||'99:99'))}
    function hasDayOverride(k){return Object.prototype.hasOwnProperty.call(state.dayOverrides,k)}
    function ensureDayOverride(k){let override=state.dayOverrides[k];if(Array.isArray(override)){const base=allOn(k),baseById=new Map(base.map(t=>[t.id,t])),seen=new Set(),tasks=[],removed=[],done={};for(const task of override){seen.add(task.id);const source=baseById.get(task.id);if(!source)tasks.push({...task,local:true});else{const patch={};for(const key of ['title','subjectId','date','start','end','estimate'])if((task[key]??'')!==(source[key]??''))patch[key]=task[key];if(Object.keys(patch).length)tasks.push({id:task.id,patch});if(!!task.done!==!!source.done)done[task.id]=!!task.done}}for(const task of base)if(!seen.has(task.id))removed.push(task.id);override={tasks,removed,done}}if(!override||typeof override!=='object')override={};if(!Array.isArray(override.tasks))override.tasks=[];if(!Array.isArray(override.removed))override.removed=[];if(!override.done||typeof override.done!=='object'||Array.isArray(override.done))override.done={};for(const task of override.tasks){if(task.subjectId&&!subjectById(task.subjectId))task.subjectId='';if(task.patch?.subjectId&&!subjectById(task.patch.subjectId))task.patch.subjectId=''}state.dayOverrides[k]=override;return override}
    function dayOn(k){const base=allOn(k);if(!hasDayOverride(k))return base;const override=ensureDayOverride(k),replacements=new Map(override.tasks.map(t=>[t.id,t])),removed=new Set(override.removed),tasks=base.filter(t=>!removed.has(t.id)).map(t=>{const entry=replacements.get(t.id);return entry?.local?{...entry}:{...t,...(entry?.patch||{})}}),included=new Set(tasks.map(t=>t.id));for(const entry of override.tasks)if(entry.local&&!included.has(entry.id)&&!removed.has(entry.id)){const {local,...task}=entry;tasks.push({...task})}for(const task of tasks)if(Object.prototype.hasOwnProperty.call(override.done,task.id))task.done=override.done[task.id];return tasks.sort((a,b)=>(a.start||'99:99').localeCompare(b.start||'99:99'))}
    function setDayTask(k,task){const override=ensureDayOverride(k),base=allOn(k).find(t=>t.id===task.id),index=override.tasks.findIndex(t=>t.id===task.id);if(base){const patch={};for(const key of ['title','subjectId','date','start','end','estimate'])if((task[key]??'')!==(base[key]??''))patch[key]=task[key];if(Object.keys(patch).length){const entry={id:task.id,patch};if(index<0)override.tasks.push(entry);else override.tasks[index]=entry}else if(index>=0)override.tasks.splice(index,1)}else{const local={...task,local:true};if(index<0)override.tasks.push(local);else override.tasks[index]=local}override.removed=override.removed.filter(id=>id!==task.id);if(!Object.prototype.hasOwnProperty.call(override.done,task.id)&&(!base||!!task.done!==!!base.done))override.done[task.id]=!!task.done;if(!override.tasks.length&&!override.removed.length&&!Object.keys(override.done).length)delete state.dayOverrides[k]}
    function removeDayTask(k,id){const override=ensureDayOverride(k);if(allOn(k).some(t=>t.id===id)){if(!override.removed.includes(id))override.removed.push(id);override.tasks=override.tasks.filter(t=>t.id!==id)}else override.tasks=override.tasks.filter(t=>t.id!==id);delete override.done[id]}
    function taskInScope(id,k,scope){return (scope==='day'?dayOn(k):allOn(k)).find(t=>t.id===id)}
    function setTaskDone(id,k,scope,done){if(scope==='day'){if(dayOn(k).some(t=>t.id===id))ensureDayOverride(k).done[id]=done}else{const t=state.tasks.find(x=>x.id===id);if(t)t.done=done}save();render()}
    function planForMonth(k){if(!state.months[k])state.months[k]={goal:'',subjects:{}};return state.months[k]}
    function planForWeek(k){if(!state.weeks[k])state.weeks[k]={goal:'',subjects:{}};return state.weeks[k]}
    function subjectById(id){return state.subjects.find(s=>s.id===id)}
    function fixedFor(k){const dow=fromKey(k).getDay();return state.settings.fixed.filter(x=>Number(x.day)===dow).sort((a,b)=>a.start.localeCompare(b.start))}
    function dayTotal(k){let total=Number(state.study.totals[k]||0);if(state.study.runningAt){const start=Number(state.study.runningAt),now=Date.now(),d=fromKey(k),a=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime(),b=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime();total+=Math.max(0,Math.min(now,b)-Math.max(start,a))/1000}return Math.floor(total)}
    function plannedFor(k){return dayOn(k).reduce((n,t)=>n+taskMinutes(t),0)}
    function weekDates(k){const start=mondayKey(k);return Array.from({length:7},(_,i)=>addDays(start,i))}
    function subjectHoursMap(tasks){const out={};for(const t of tasks)out[t.subjectId]=(out[t.subjectId]||0)+taskMinutes(t);return out}
    function taskConflicts(k){const tasks=dayOn(k).filter(t=>t.start&&t.end);const fixed=fixedFor(k);let msgs=[];for(let i=0;i<tasks.length;i++){const a=tasks[i],as=timeMin(a.start),ae=timeMin(a.end);for(let j=i+1;j<tasks.length;j++){const b=tasks[j],bs=timeMin(b.start),be=timeMin(b.end);if(as<be&&bs<ae)msgs.push(`공부 일정 “${a.title}”과 “${b.title}” 시간이 겹칩니다.`)}for(const f of fixed){const fs=timeMin(f.start),fe=timeMin(f.end);if(as<fe&&fs<ae)msgs.push(`공부 일정 “${a.title}”이 고정 일정 “${f.title}”과 겹칩니다.`)}}return [...new Set(msgs)]}
    function toast(text){const el=$('#toast');el.textContent=text;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2400)}
    function pageInfo(){return {home:['오늘의 계획','오늘 공부할 것'],month:['수능까지의 흐름','월간 계획'],week:['이번 주 계획','주간 계획'],day:['시간표와 실행','일간 시간표'],settings:['내 플래너 설정','과목 및 설정']}[page]}
    function nav(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const [e,t]=pageInfo();$('#pageEyebrow').textContent=e;$('#pageTitle').textContent=t;$('#headerDate').textContent=dateLabel(keyOf(new Date()))}
    function render(){nav();const view=$('#pageView');view.innerHTML=page==='home'?renderHome():page==='month'?renderMonth():page==='week'?renderWeek():page==='day'?renderDay():renderSettings()}
    function renderHome(){
      const today=keyOf(new Date()),tasks=dayOn(today),done=tasks.filter(t=>t.done).length,available=Number(state.settings.availability[fromKey(today).getDay()]||0)*60,planned=plannedFor(today);const exam=state.settings.examDate;let dday='수능 날짜를 설정해 주세요';if(exam){const days=Math.ceil((fromKey(exam)-fromKey(today))/86400000);dday=days>0?`수능까지 D-${days}`:days===0?'오늘은 수능일입니다':`수능일이 지났습니다`}
      const remaining=Math.max(0,available-planned);
      return `<div class="hero-grid"><section class="hero"><div class="eyebrow">${esc(dateLabel(today))} · 2028학년도 수능</div><h2>오늘 할 공부에<br>차근차근 집중해요.</h2><p>계획은 직접 세우고, 하루의 흐름은 한눈에 확인하세요.</p><div class="hero-actions"><span class="dday">◷ ${esc(dday)}</span><button class="btn hero-link" data-page="day">오늘 시간표 보기 <span aria-hidden="true">→</span></button></div></section></div>
      <div class="stats"><div class="stat"><div class="stat-label">오늘 계획한 공부</div><div class="stat-value">${hours(planned)}</div><div class="stat-sub">${tasks.length}개 일정</div></div><div class="stat"><div class="stat-label">공부 가능 여유</div><div class="stat-value">${available?hours(remaining):'설정 필요'}</div><div class="stat-sub">${available?`가능 ${hours(available)} 중`:'설정에서 요일별 시간을 입력해 주세요'}</div></div></div>
      ${available&&planned>available?`<div class="warning red">오늘 계획한 공부 시간이 설정한 공부 가능 시간보다 ${hours(planned-available)} 많습니다.</div>`:''}
      <section class="card"><div class="card-title-row"><div><h2 class="card-title">오늘의 계획</h2><p class="card-desc">완료 여부와 남은 일정을 확인하세요.</p></div><button class="btn small primary" data-add-task>＋ 계획 추가</button></div>${tasks.length?`<div class="task-list">${tasks.map(t=>taskRow(t,'day')).join('')}</div>`:`<div class="empty"><b>아직 오늘 계획이 없어요</b>공부할 과목과 내용을 추가해 보세요.</div>`}<div class="progress-wrap"><div class="progress-meta"><span>완료한 일정</span><span>${done} / ${tasks.length}</span></div><div class="progress"><i style="width:${tasks.length?Math.round(done/tasks.length*100):0}%"></i></div></div></section>`
    }

    function renderMonth(){const [y,m]=monthShowing.split('-').map(Number),first=new Date(y,m-1,1),offset=(first.getDay()+6)%7,days=new Date(y,m,0).getDate(),prevDays=new Date(y,m-1,0).getDate(),cells=[];const goal=planForMonth(monthShowing);for(let i=0;i<42;i++){let dateKey,day,muted=false;if(i<offset){day=prevDays-offset+i+1;dateKey=keyOf(new Date(y,m-2,day));muted=true}else if(i>=offset+days){day=i-offset-days+1;dateKey=keyOf(new Date(y,m,day));muted=true}else{day=i-offset+1;dateKey=keyOf(new Date(y,m-1,day))}const count=dayOn(dateKey).length,fixedCount=fixedFor(dateKey).length,selected=dateKey===selectedDate,isToday=dateKey===keyOf(new Date());cells.push(`<button class="cal-day ${muted?'muted':''} ${selected?'selected':''} ${isToday?'today':''}" data-date="${dateKey}"><span class="day-num">${day}</span>${count||fixedCount?`<div class="cal-indicators"><i></i></div><div class="cal-count">${count?`${count}개 계획`:''}${count&&fixedCount?' · ':''}${fixedCount?`고정 ${fixedCount}`:''}</div>`:''}</button>`)}

    function modal(title,body){$('#modalBody').innerHTML=`<div class="modal-head"><h2>${title}</h2><button class="modal-close" data-close-modal aria-label="닫기">×</button></div>${body}`;$('#modal').classList.add('open')}

    function taskModal(id=null,date=selectedDate,scope='week'){const t=id?taskInScope(id,date,scope):null;if(!state.subjects.length){toast('과목 및 설정에서 과목을 먼저 추가해 주세요.');page='settings';render();return}const sourceDate=t?.date||date,scopeHint=scope==='day'?`${dateLabel(sourceDate,false)} 날짜에만 저장됩니다. 주간 계획에는 영향을 주지 않습니다.`:'주간 계획에 저장됩니다. 일간 시간표는 별도 수정이 없으면 주간 계획을 기본값으로 사용합니다.';modal(t?`${scope==='day'?'일간 시간표':'주간 계획'} 수정`:`${scope==='day'?'일간 시간표':'주간 계획'} 추가`, `<form id="taskForm"><input type="hidden" name="id" value="${esc(t?.id||'')}"><input type="hidden" name="scope" value="${scope}"><input type="hidden" name="sourceDate" value="${esc(sourceDate)}"><div class="form-grid"><label class="field"><span class="field-label">날짜</span><input class="input" type="date" name="date" required value="${esc(t?.date||date)}"></label><label class="field"><span class="field-label">과목</span><select class="select" name="subjectId" required>${state.subjects.map(s=>`<option value="${esc(s.id)}" ${t?.subjectId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label><label class="field" style="grid-column:1/-1"><span class="field-label">공부할 내용</span><input class="input" name="title" required maxlength="100" placeholder="예: 함수 개념 정리" value="${esc(t?.title||'')}"></label><label class="field"><span class="field-label">시작 시간 (선택)</span><input class="input" type="time" name="start" value="${esc(t?.start||'')}"></label><label class="field"><span class="field-label">종료 시간 (선택)</span><input class="input" type="time" name="end" value="${esc(t?.end||'')}"></label><label class="field" style="grid-column:1/-1"><span class="field-label">예상 공부 시간 (시작·종료 시간을 정하지 않을 때, 분)</span><input class="input" type="number" name="estimate" min="0" step="5" placeholder="예: 50" value="${esc(t?.estimate||'')}"></label></div><div class="hint" style="margin-top:9px">${scopeHint} 시간을 지정하면 시간표에서 겹침을 확인합니다.</div><div class="modal-actions">${t?`<button class="btn danger" type="button" data-remove-task="${esc(t.id)}" data-task-scope="${scope}" data-task-date="${esc(sourceDate)}">삭제</button>`:''}<button class="btn" type="button" data-close-modal>취소</button><button class="btn primary" type="submit">저장</button></div></form>`)}
    function subjectModal(id=null){const s=id?subjectById(id):null;modal(s?'과목 수정':'과목 추가',`<form id="subjectForm"><input type="hidden" name="id" value="${esc(s?.id||'')}"><div class="form-grid"><label class="field"><span class="field-label">과목 이름</span><input class="input" name="name" maxlength="30" required placeholder="원하는 과목 이름" value="${esc(s?.name||'')}"></label><label class="field"><span class="field-label">우선순위</span><select class="select" name="priority"><option value="high" ${s?.priority==='high'?'selected':''}>높음</option><option value="normal" ${!s?.priority||s?.priority==='normal'?'selected':''}>보통</option><option value="low" ${s?.priority==='low'?'selected':''}>낮음</option></select></label></div><div class="modal-actions"><button type="button" class="btn" data-close-modal>취소</button><button class="btn primary" type="submit">저장</button></div></form>`)}
    function fixedModal(id=null){const f=id?state.settings.fixed.find(x=>x.id===id):null;modal(f?'반복 고정 일정 수정':'반복 고정 일정 추가',`<form id="${f?'editFixedForm':'fixedForm'}"><input type="hidden" name="id" value="${esc(f?.id||'')}"><div class="form-grid"><label class="field"><span class="field-label">요일</span><select class="select" name="day">${weekdays.map((d,i)=>`<option value="${i}" ${Number(f?.day)===i?'selected':''}>${d}요일</option>`).join('')}</select></label><label class="field"><span class="field-label">일정 이름</span><input class="input" name="title" required maxlength="50" placeholder="예: 학원" value="${esc(f?.title||'')}"></label><label class="field"><span class="field-label">시작</span><input class="input" type="time" name="start" required value="${esc(f?.start||'')}"></label><label class="field"><span class="field-label">종료</span><input class="input" type="time" name="end" required value="${esc(f?.end||'')}"></label></div><div class="modal-actions"><button type="button" class="btn" data-close-modal>취소</button><button class="btn primary" type="submit">저장</button></div></form>`)}
    function pomoSeconds(){if(state.pomo.running&&state.pomo.endsAt)return Math.max(0,Math.ceil((state.pomo.endsAt-Date.now())/1000));if(state.pomo.remainingMs!=null)return Math.max(0,Math.ceil(state.pomo.remainingMs/1000));return (state.pomo.phase==='focus'?Number(state.settings.pomoFocus):Number(state.settings.pomoBreak))*60}
    function startPomo(){if(state.pomo.running){state.pomo.remainingMs=Math.max(0,state.pomo.endsAt-Date.now());state.pomo.running=false;state.pomo.endsAt=null}else{if(state.pomo.remainingMs==null)state.pomo.remainingMs=(state.pomo.phase==='focus'?Number(state.settings.pomoFocus):Number(state.settings.pomoBreak))*60000;state.pomo.endsAt=Date.now()+state.pomo.remainingMs;state.pomo.remainingMs=null;state.pomo.running=true}save();render()}
    function resetPomo(){state.pomo={phase:'focus',running:false,endsAt:null,remainingMs:null,cycles:state.pomo.cycles||0};save();render()}
    function endStudy(){const end=Date.now(),start=Number(state.study.runningAt);if(start){let cursor=start;while(cursor<end){const d=new Date(cursor),next=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime(),until=Math.min(end,next),sec=Math.floor((until-cursor)/1000),k=keyOf(d);state.study.totals[k]=(Number(state.study.totals[k])||0)+sec;cursor=until}}state.study.runningAt=null;save();render()}
    function refreshLive(){const clockEl=$('#studyClock');if(clockEl)clockEl.textContent=clock(dayTotal(keyOf(new Date())));const dayEl=$('#dayActual');if(dayEl)dayEl.textContent=hours(Math.floor(dayTotal(selectedDate)/60));const stat=$('#studyStat');if(stat)stat.textContent=hours(Math.floor(dayTotal(keyOf(new Date()))/60));const pc=$('#pomoClock');if(pc)pc.textContent=shortClock(pomoSeconds());const pp=$('#pomoPhase');if(pp)pp.textContent=state.pomo.phase==='focus'?'집중 시간':'휴식 시간';if(state.pomo.running&&state.pomo.endsAt<=Date.now()){let guard=0;while(state.pomo.running&&state.pomo.endsAt<=Date.now()&&guard++<50){const ended=state.pomo.phase;if(ended==='focus'){state.pomo.phase='break'}else{state.pomo.phase='focus';state.pomo.cycles=(state.pomo.cycles||0)+1}const duration=(state.pomo.phase==='focus'?Number(state.settings.pomoFocus):Number(state.settings.pomoBreak))*60000;state.pomo.endsAt+=duration}save();if(navigator.vibrate)navigator.vibrate([120,60,120]);render()}}
    function persistMonthField(el){const p=planForMonth(monthShowing);if(el.id==='monthGoal')p.goal=el.value;else if(el.dataset.monthReview)p.review=el.value;else if(el.dataset.monthHours){p.subjects[el.dataset.monthHours]={...(p.subjects[el.dataset.monthHours]||{}),hours:el.value}}else if(el.dataset.monthContent){p.subjects[el.dataset.monthContent]={...(p.subjects[el.dataset.monthContent]||{}),content:el.value}}save()}
    function persistWeekField(el){const p=planForWeek(mondayKey(selectedDate));if(el.id==='weekGoal')p.goal=el.value;else if(el.dataset.weekHours)p.subjects[el.dataset.weekHours]=el.value;save()}
    function moveMonth(n){const [y,m]=monthShowing.split('-').map(Number),d=new Date(y,m-1+n,1);monthShowing=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;render()}
    document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;if(page==='month')monthShowing=monthKey(selectedDate);render();return}if(b.hasAttribute('data-add-task')){taskModal(null,selectedDate);return}if(b.dataset.addTaskFor){taskModal(null,b.dataset.addTaskFor);return}if(b.dataset.editTask){taskModal(b.dataset.editTask);return}if(b.dataset.toggleTask){const t=state.tasks.find(x=>x.id===b.dataset.toggleTask);if(t){t.done=!t.done;save();render()}return}if(b.dataset.monthShift){moveMonth(Number(b.dataset.monthShift));return}if(b.dataset.date){selectedDate=b.dataset.date;if(page==='month')monthShowing=monthKey(selectedDate);page=page==='month'?'day':page;render();return}if(b.dataset.weekShift){selectedDate=addDays(selectedDate,Number(b.dataset.weekShift));render();return}if(b.hasAttribute('data-week-today')){selectedDate=keyOf(new Date());render();return}if(b.dataset.dayShift){selectedDate=addDays(selectedDate,Number(b.dataset.dayShift));render();return}if(b.hasAttribute('data-day-today')){selectedDate=keyOf(new Date());render();return}if(b.hasAttribute('data-study-toggle')){state.study.runningAt?endStudy():(state.study.runningAt=Date.now(),save(),render());return}if(b.hasAttribute('data-pomo-toggle')){startPomo();return}if(b.hasAttribute('data-pomo-reset')){resetPomo();return}if(b.hasAttribute('data-add-subject')){subjectModal();return}if(b.dataset.editSubject){subjectModal(b.dataset.editSubject);return}if(b.dataset.deleteSubject){if(confirm('이 과목을 삭제할까요? 연결된 공부 계획은 과목 없음으로 남습니다.')){state.subjects=state.subjects.filter(s=>s.id!==b.dataset.deleteSubject);state.tasks.forEach(t=>{if(t.subjectId===b.dataset.deleteSubject)t.subjectId='' });Object.values(state.months).forEach(m=>delete m.subjects[b.dataset.deleteSubject]);Object.values(state.weeks).forEach(w=>delete w.subjects[b.dataset.deleteSubject]);save();render()}return}if(b.hasAttribute('data-add-fixed')){fixedModal();return}if(b.dataset.deleteFixed){state.settings.fixed=state.settings.fixed.filter(x=>x.id!==b.dataset.deleteFixed);save();render();return}if(b.dataset.removeTask){state.tasks=state.tasks.filter(t=>t.id!==b.dataset.removeTask);save();closeModal();render();return}if(b.hasAttribute('data-close-modal')){closeModal();return}if(b.hasAttribute('data-install')||b.id==='installBtn'){if(deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.finally(()=>{deferredInstall=null;$('#installBtn').hidden=true})}return}});
    document.addEventListener('input',e=>{const el=e.target;if(el.id==='monthGoal'||el.dataset.monthHours||el.dataset.monthContent||el.dataset.monthReview)persistMonthField(el);if(el.id==='weekGoal'||el.dataset.weekHours)persistWeekField(el)});
    document.addEventListener('change',e=>{const el=e.target;if(el.dataset.availability!=null){state.settings.availability[Number(el.dataset.availability)]=Number(el.value)||0;save();render()}else if(el.hasAttribute('data-exam-date')){state.settings.examDate=el.value;save();render()}else if(el.dataset.pomoSetting){state.settings[el.dataset.pomoSetting]=Math.max(1,Number(el.value)||1);save();render()}else if(el.id==='monthGoal'||el.dataset.monthHours||el.dataset.monthContent)persistMonthField(el);else if(el.id==='weekGoal'||el.dataset.weekHours)persistWeekField(el)});
    document.addEventListener('submit',e=>{e.preventDefault();const form=e.target,fd=new FormData(form);if(form.id==='taskForm'){const id=String(fd.get('id')||''),scope=fd.get('scope')==='day'?'day':'week',sourceDate=String(fd.get('sourceDate')||fd.get('date')),existing=id?taskInScope(id,sourceDate,scope):null,task={id:id||crypto.randomUUID(),title:String(fd.get('title')).trim(),subjectId:fd.get('subjectId'),date:String(fd.get('date')),start:fd.get('start'),end:fd.get('end'),estimate:Number(fd.get('estimate'))||0,done:!!existing?.done};if(task.start&&!task.end||!task.start&&task.end){toast('시작과 종료 시간을 모두 입력하거나 둘 다 비워 주세요.');return}if(task.start&&task.end&&timeMin(task.end)<=timeMin(task.start)){toast('종료 시간은 시작 시간보다 뒤여야 합니다.');return}if(scope==='day'){if(id){const original=ensureDayOverride(sourceDate),oldIndex=original.findIndex(t=>t.id===id);if(oldIndex>=0)original.splice(oldIndex,1)}const target=ensureDayOverride(task.date),targetIndex=id?target.findIndex(t=>t.id===id):-1;if(targetIndex>=0)target[targetIndex]=task;else target.push(task)}else{const idx=id?state.tasks.findIndex(t=>t.id===id):-1;if(idx>=0)state.tasks[idx]=task;else state.tasks.push(task)}selectedDate=task.date;save();closeModal();render();return}if(form.id==='subjectForm'){const id=fd.get('id'),name=String(fd.get('name')).trim();if(!name)return;const existing=state.subjects.find(s=>s.id===id);if(existing)existing.name=name;else state.subjects.push({id:crypto.randomUUID(),name,priority:fd.get('priority')||'normal',color:colors[state.subjects.length%colors.length]});save();closeModal();render();return}if(form.id==='fixedForm'){const f={id:crypto.randomUUID(),day:Number(fd.get('day')),title:String(fd.get('title')).trim(),start:fd.get('start'),end:fd.get('end')};if(timeMin(f.end)<=timeMin(f.start)){toast('종료 시간은 시작 시간보다 뒤여야 합니다.');return}state.settings.fixed.push(f);save();closeModal();render()}});
    document.addEventListener('submit',e=>{const form=e.target;if(form.id!=='taskForm')return;e.preventDefault();e.stopImmediatePropagation();const fd=new FormData(form),id=String(fd.get('id')||''),scope=fd.get('scope')==='day'?'day':'week',sourceDate=String(fd.get('sourceDate')||fd.get('date')),existing=id?taskInScope(id,sourceDate,scope):null,task={id:id||crypto.randomUUID(),title:String(fd.get('title')).trim(),subjectId:fd.get('subjectId'),date:String(fd.get('date')),start:fd.get('start'),end:fd.get('end'),estimate:Number(fd.get('estimate'))||0,done:!!existing?.done};if(task.start&&!task.end||!task.start&&task.end){toast('시작과 종료 시간을 모두 입력하거나 둘 다 비워 주세요.');return}if(task.start&&task.end&&timeMin(task.end)<=timeMin(task.start)){toast('종료 시간은 시작 시간보다 뒤여야 합니다.');return}if(scope==='day'){if(id&&sourceDate!==task.date)removeDayTask(sourceDate,id);setDayTask(task.date,task)}else{const idx=id?state.tasks.findIndex(t=>t.id===id):-1;if(idx>=0)state.tasks[idx]=task;else state.tasks.push(task)}selectedDate=task.date;save();closeModal();render()},true);
    $('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
    document.addEventListener('click',e=>{const remove=e.target.closest('[data-remove-task]');if(remove){e.preventDefault();e.stopImmediatePropagation();const scope=remove.dataset.taskScope||'week',date=remove.dataset.taskDate||selectedDate;if(scope==='day')removeDayTask(date,remove.dataset.removeTask);else state.tasks=state.tasks.filter(t=>t.id!==remove.dataset.removeTask);save();closeModal();render();return}const del=e.target.closest('[data-delete-subject]');if(!del)return;e.preventDefault();e.stopImmediatePropagation();if(confirm('이 과목을 삭제할까요? 연결된 공부 계획은 과목 없음으로 남습니다.')){const id=del.dataset.deleteSubject;state.subjects=state.subjects.filter(s=>s.id!==id);state.tasks.forEach(t=>{if(t.subjectId===id)t.subjectId=''});Object.keys(state.dayOverrides).forEach(date=>ensureDayOverride(date).tasks.forEach(t=>{if(t.subjectId===id)t.subjectId=''}));Object.values(state.months).forEach(m=>delete m.subjects[id]);Object.values(state.weeks).forEach(w=>delete w.subjects[id]);save();render()}},true);
    document.addEventListener('click',e=>{const add=e.target.closest('[data-add-task]');if(add){e.preventDefault();e.stopImmediatePropagation();taskModal(null,selectedDate,add.dataset.taskScope||(page==='home'||page==='day'?'day':'week'));return}const addFor=e.target.closest('[data-add-task-for]');if(addFor){e.preventDefault();e.stopImmediatePropagation();taskModal(null,addFor.dataset.addTaskFor,'week');return}const edit=e.target.closest('[data-edit-task]');if(edit){e.preventDefault();e.stopImmediatePropagation();taskModal(edit.dataset.editTask,edit.dataset.taskDate||selectedDate,edit.dataset.taskScope||'week');return}const remove=e.target.closest('[data-remove-task]');if(remove){e.preventDefault();e.stopImmediatePropagation();const scope=remove.dataset.taskScope||'week',date=remove.dataset.taskDate||selectedDate;if(scope==='day'){const tasks=ensureDayOverride(date);state.dayOverrides[date]=tasks.filter(t=>t.id!==remove.dataset.removeTask)}else state.tasks=state.tasks.filter(t=>t.id!==remove.dataset.removeTask);save();closeModal();render();return}const reset=e.target.closest('[data-reset-day]');if(reset){e.preventDefault();e.stopImmediatePropagation();const date=reset.dataset.resetDay;if(confirm('이 날짜의 일간 수정본을 지우고 현재 주간 계획으로 되돌릴까요?')){delete state.dayOverrides[date];save();render()}return}const deleteSubject=e.target.closest('[data-delete-subject]');if(deleteSubject){e.preventDefault();e.stopImmediatePropagation();if(confirm('이 과목을 삭제할까요? 연결된 공부 계획은 과목 없음으로 남습니다.')){const id=deleteSubject.dataset.deleteSubject;state.subjects=state.subjects.filter(s=>s.id!==id);state.tasks.forEach(t=>{if(t.subjectId===id)t.subjectId=''});Object.values(state.dayOverrides).forEach(list=>list.forEach(t=>{if(t.subjectId===id)t.subjectId=''}));Object.values(state.months).forEach(m=>delete m.subjects[id]);Object.values(state.weeks).forEach(w=>delete w.subjects[id]);save();render()}return}const b=e.target.closest('[data-date]');if(!b)return;if(page==='month')monthShowing=monthKey(b.dataset.date);selectedDate=b.dataset.date;page='day';render();e.stopImmediatePropagation()},true);
    document.addEventListener('click',e=>{const b=e.target.closest('[data-edit-fixed]');if(b)fixedModal(b.dataset.editFixed)});
    document.addEventListener('change',e=>{const el=e.target;if(!el.dataset.toggleTask)return;setTaskDone(el.dataset.toggleTask,el.dataset.taskDate||selectedDate,el.dataset.taskScope||'week',el.checked)});
    document.addEventListener('submit',e=>{const form=e.target;if(form.id!=='subjectForm')return;e.preventDefault();e.stopImmediatePropagation();const fd=new FormData(form),id=fd.get('id'),name=String(fd.get('name')).trim(),priority=fd.get('priority')||'normal';if(!name)return;const existing=state.subjects.find(s=>s.id===id);if(existing){existing.name=name;existing.priority=priority}else state.subjects.push({id:crypto.randomUUID(),name,priority,color:colors[state.subjects.length%colors.length]});save();closeModal();render()},true);
    document.addEventListener('submit',e=>{const form=e.target;if(form.id!=='editFixedForm')return;e.preventDefault();const fd=new FormData(form),f=state.settings.fixed.find(x=>x.id===fd.get('id'));if(!f)return;const start=fd.get('start'),end=fd.get('end');if(timeMin(end)<=timeMin(start)){toast('종료 시간은 시작 시간보다 뒤여야 합니다.');return}f.day=Number(fd.get('day'));f.title=String(fd.get('title')).trim();f.start=start;f.end=end;save();closeModal();render()});
    window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;$('#installBtn').hidden=false});
    window.addEventListener('appinstalled',()=>{$('#installBtn').hidden=true;toast('앱 설치가 완료되었습니다.')});
    if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
    render();
  })();
  </script>
