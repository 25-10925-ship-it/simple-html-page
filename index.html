  <script>
  (() => {
    'use strict';
    const KEY = 'oneul-study-planner-v1';
    const weekdays = ['일','월','화','수','목','금','토'];
    const colors = ['#6878df','#2a9d80','#e39c42','#c7688b','#4a99c3','#8a70c5','#9b8c53'];
    const fresh = () => ({
      settings:{examDate:'2027-11-18',availability:[0,0,0,0,0,0,0],fixed:[],pomoFocus:25,pomoBreak:5},
      subjects:[],months:{},weeks:{},tasks:[],study:{totals:{},runningAt:null},
      pomo:{phase:'focus',running:false,endsAt:null,remainingMs:null,cycles:0}
    });
    function load(){try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(!raw)return fresh();const base=fresh();return {...base,...raw,settings:{...base.settings,...(raw.settings||{})},study:{...base.study,...(raw.study||{})},pomo:{...base.pomo,...(raw.pomo||{})}}}catch(_){return fresh()}}
    let state = load();
    let page = 'home';
    let selectedDate = keyOf(new Date());
    let monthShowing = selectedDate.slice(0,7);
    let deferredInstall = null;
    const $ = s => document.querySelector(s);
    const esc = v => String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(_){toast('저장 공간을 사용할 수 없습니다. 브라우저 설정을 확인해 주세요.')}}
    function keyOf(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
    function fromKey(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
    function addDays(k,n){const d=fromKey(k);d.setDate(d.getDate()+n);return keyOf(d)}
    function monthKey(k){return k.slice(0,7)}
    function mondayKey(k){const d=fromKey(k);return addDays(k,-((d.getDay()+6)%7))}
    function dateLabel(k,withYear=true){const d=fromKey(k);return `${withYear?`${d.getFullYear()}년 `:''}${d.getMonth()+1}월 ${d.getDate()}일 (${weekdays[d.getDay()]})`}
    function monthLabel(k){const [y,m]=k.split('-').map(Number);return `${y}년 ${m}월`}
    function hours(min){const h=Math.floor(min/60),m=min%60;return h?`${h}시간${m?` ${m}분`:''}`:`${m}분`}
    function clock(sec){sec=Math.max(0,Math.floor(sec));return `${String(Math.floor(sec/3600)).padStart(2,'0')}:${String(Math.floor(sec%3600/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
    function shortClock(sec){sec=Math.max(0,Math.floor(sec));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
    function timeMin(t){if(!t)return null;const [h,m]=t.split(':').map(Number);return h*60+m}
    function taskMinutes(t){if(t.start&&t.end){let a=timeMin(t.start),b=timeMin(t.end);if(b<a)b+=1440;return b-a}return Math.max(0,Number(t.estimate)||0)}
    function allOn(k){return state.tasks.filter(t=>t.date===k).sort((a,b)=>(a.start||'99:99').localeCompare(b.start||'99:99'))}
    function planForMonth(k){if(!state.months[k])state.months[k]={goal:'',subjects:{}};return state.months[k]}

    function renderSettings(){const subjectRows=state.subjects.map(s=>`<div class="setting-row"><div><div class="setting-row-title"><i class="subject-dot" style="background:${esc(s.color)}"></i>${esc(s.name)}</div><div class="setting-row-sub">월간·주간·일간 계획에 사용할 과목</div></div><div class="quick-actions"><button class="btn small" data-edit-subject="${esc(s.id)}">수정</button><button class="btn small danger" data-delete-subject="${esc(s.id)}">삭제</button></div></div>`).join('');const av=weekdays.map((w,i)=>`<div class="availability-row"><span class="availability-day">${w}요일</span><input class="input slim" type="number" min="0" max="24" step="0.5" placeholder="미설정" value="${esc(state.settings.availability[i]||'')}" data-availability="${i}"><span class="hint">시간</span></div>`).join('');const fixed=state.settings.fixed.map(f=>`<div class="setting-row"><div><div class="setting-row-title">${weekdays[f.day]}요일 · ${esc(f.title)}</div><div class="setting-row-sub">${esc(f.start)}–${esc(f.end)} · 매주 반복</div></div><div class="quick-actions"><button class="btn small" data-edit-fixed="${esc(f.id)}">수정</button><button class="btn small danger" data-delete-fixed="${esc(f.id)}">삭제</button></div></div>`).join('');
      return `<div class="settings-grid"><section class="card settings-section"><div class="card-title-row"><div><h2 class="card-title">과목 목록</h2><p class="card-desc">원하는 이름으로 추가하고 언제든 수정하세요.</p></div><button class="btn primary small" data-add-subject>＋ 과목 추가</button></div><div class="settings-list">${subjectRows||`<div class="empty"><b>아직 등록한 과목이 없습니다</b>직접 이름을 정해 추가해 주세요.</div>`}</div></section>
      <section class="card settings-section"><div><h2 class="card-title">수능 날짜</h2><p class="card-desc">D-day 계산에 사용하며 날짜를 바꿀 수 있습니다.</p></div><label class="field"><span class="field-label">2028학년도 수능일</span><input class="input" type="date" value="${esc(state.settings.examDate)}" data-exam-date></label><p class="hint">기본 날짜는 교육부 발표 기준이며, 필요하면 직접 수정할 수 있습니다.</p></section>
      <section class="card settings-section"><div><h2 class="card-title">요일별 공부 가능 시간</h2><p class="card-desc">학교·학원·식사 등 고정 일정을 고려해 공부에 쓸 수 있는 시간을 입력하세요.</p></div><div class="availability-list">${av}</div><p class="hint">0.5시간 단위로 입력할 수 있습니다. 미입력 요일은 시간 한도를 표시하지 않습니다.</p></section>
      <section class="card settings-section"><div class="card-title-row"><div><h2 class="card-title">매주 반복 고정 일정</h2><p class="card-desc">학교, 학원, 식사 등 반복 일정을 등록하고 수정할 수 있습니다.</p></div><button class="btn small" data-add-fixed>＋ 일정 추가</button></div><div class="settings-list">${fixed||`<div class="empty">등록한 반복 일정이 없습니다.</div>`}</div><p class="hint">특정 날짜에만 있는 일정은 해당 날짜의 계획을 직접 수정해 주세요.</p></section>
      <section class="card settings-section"><div><h2 class="card-title">뽀모도로 시간</h2><p class="card-desc">공부 스톱워치와 분리되어 동작합니다.</p></div><div class="form-grid"><label class="field"><span class="field-label">집중 시간 (분)</span><input class="input" type="number" min="1" max="180" value="${esc(state.settings.pomoFocus)}" data-pomo-setting="pomoFocus"></label><label class="field"><span class="field-label">휴식 시간 (분)</span><input class="input" type="number" min="1" max="90" value="${esc(state.settings.pomoBreak)}" data-pomo-setting="pomoBreak"></label></div><p class="hint">원하는 집중·휴식 시간을 입력하세요. 뽀모도로 시간은 실제 공부 시간 합계에 포함되지 않습니다.</p></section>
      <section class="card settings-section"><div><h2 class="card-title">저장 방식</h2><p class="card-desc">계획과 타이머 기록은 이 태블릿의 브라우저에 저장됩니다.</p></div><div class="notice">오프라인에서도 사용할 수 있습니다. 다른 기기 동기화와 백업·복원 기능은 제공하지 않습니다.</div></section></div>`}
    function modal(title,body){$('#modalBody').innerHTML=`<div class="modal-head"><h2>${title}</h2><button class="modal-close" data-close-modal aria-label="닫기">×</button></div>${body}`;$('#modal').classList.add('open')}
    function closeModal(){$('#modal').classList.remove('open');$('#modalBody').innerHTML=''}
    function taskModal(id=null,date=selectedDate){const t=id?state.tasks.find(x=>x.id===id):null;if(!state.subjects.length){toast('과목 및 설정에서 과목을 먼저 추가해 주세요.');page='settings';render();return}modal(t?'공부 계획 수정':'공부 계획 추가',`<form id="taskForm"><input type="hidden" name="id" value="${esc(t?.id||'')}"><div class="form-grid"><label class="field"><span class="field-label">날짜</span><input class="input" type="date" name="date" required value="${esc(t?.date||date)}"></label><label class="field"><span class="field-label">과목</span><select class="select" name="subjectId" required>${state.subjects.map(s=>`<option value="${esc(s.id)}" ${t?.subjectId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label><label class="field" style="grid-column:1/-1"><span class="field-label">공부할 내용</span><input class="input" name="title" required maxlength="100" placeholder="예: 함수 개념 정리" value="${esc(t?.title||'')}"></label><label class="field"><span class="field-label">시작 시간 (선택)</span><input class="input" type="time" name="start" value="${esc(t?.start||'')}"></label><label class="field"><span class="field-label">종료 시간 (선택)</span><input class="input" type="time" name="end" value="${esc(t?.end||'')}"></label><label class="field" style="grid-column:1/-1"><span class="field-label">예상 공부 시간 (시작·종료 시간을 정하지 않을 때, 분)</span><input class="input" type="number" name="estimate" min="0" step="5" placeholder="예: 50" value="${esc(t?.estimate||'')}"></label></div><div class="hint" style="margin-top:9px">시간을 지정하면 시간표와 겹침을 확인합니다. 일정을 옮기거나 조정할 때는 날짜와 시간을 직접 수정하세요.</div><div class="modal-actions">${t?`<button class="btn danger" type="button" data-remove-task="${esc(t.id)}">삭제</button>`:''}<button class="btn" type="button" data-close-modal>취소</button><button class="btn primary" type="submit">저장</button></div></form>`)}
    function subjectModal(id=null){const s=id?subjectById(id):null;modal(s?'과목 수정':'과목 추가',`<form id="subjectForm"><input type="hidden" name="id" value="${esc(s?.id||'')}"><div class="form-grid"><label class="field"><span class="field-label">과목 이름</span><input class="input" name="name" maxlength="30" required placeholder="원하는 과목 이름" value="${esc(s?.name||'')}"></label><label class="field"><span class="field-label">우선순위</span><select class="select" name="priority"><option value="high" ${s?.priority==='high'?'selected':''}>높음</option><option value="normal" ${!s?.priority||s?.priority==='normal'?'selected':''}>보통</option><option value="low" ${s?.priority==='low'?'selected':''}>낮음</option></select></label></div><div class="modal-actions"><button type="button" class="btn" data-close-modal>취소</button><button class="btn primary" type="submit">저장</button></div></form>`)}
    function fixedModal(id=null){const f=id?state.settings.fixed.find(x=>x.id===id):null;modal(f?'반복 고정 일정 수정':'반복 고정 일정 추가',`<form id="${f?'editFixedForm':'fixedForm'}"><input type="hidden" name="id" value="${esc(f?.id||'')}"><div class="form-grid"><label class="field"><span class="field-label">요일</span><select class="select" name="day">${weekdays.map((d,i)=>`<option value="${i}" ${Number(f?.day)===i?'selected':''}>${d}요일</option>`).join('')}</select></label><label class="field"><span class="field-label">일정 이름</span><input class="input" name="title" required maxlength="50" placeholder="예: 학원" value="${esc(f?.title||'')}"></label><label class="field"><span class="field-label">시작</span><input class="input" type="time" name="start" required value="${esc(f?.start||'')}"></label><label class="field"><span class="field-label">종료</span><input class="input" type="time" name="end" required value="${esc(f?.end||'')}"></label></div><div class="modal-actions"><button type="button" class="btn" data-close-modal>취소</button><button class="btn primary" type="submit">저장</button></div></form>`)}
    function pomoSeconds(){if(state.pomo.running&&state.pomo.endsAt)return Math.max(0,Math.ceil((state.pomo.endsAt-Date.now())/1000));if(state.pomo.remainingMs!=null)return Math.max(0,Math.ceil(state.pomo.remainingMs/1000));return (state.pomo.phase==='focus'?Number(state.settings.pomoFocus):Number(state.settings.pomoBreak))*60}
    function startPomo(){if(state.pomo.running){state.pomo.remainingMs=Math.max(0,state.pomo.endsAt-Date.now());state.pomo.running=false;state.pomo.endsAt=null}else{if(state.pomo.remainingMs==null)state.pomo.remainingMs=(state.pomo.phase==='focus'?Number(state.settings.pomoFocus):Number(state.settings.pomoBreak))*60000;state.pomo.endsAt=Date.now()+state.pomo.remainingMs;state.pomo.remainingMs=null;state.pomo.running=true}save();render()}
    function resetPomo(){state.pomo={phase:'focus',running:false,endsAt:null,remainingMs:null,cycles:state.pomo.cycles||0};save();render()}
    function endStudy(){const end=Date.now(),start=Number(state.study.runningAt);if(start){let cursor=start;while(cursor<end){const d=new Date(cursor),next=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime(),until=Math.min(end,next),sec=Math.floor((until-cursor)/1000),k=keyOf(d);state.study.totals[k]=(Number(state.study.totals[k])||0)+sec;cursor=until}}state.study.runningAt=null;save();render()}
    function refreshLive(){const clockEl=$('#studyClock');if(clockEl)clockEl.textContent=clock(dayTotal(keyOf(new Date())));const dayEl=$('#dayActual');if(dayEl)dayEl.textContent=hours(Math.floor(dayTotal(selectedDate)/60));const stat=$('#studyStat');if(stat)stat.textContent=hours(Math.floor(dayTotal(keyOf(new Date()))/60));const pc=$('#pomoClock');if(pc)pc.textContent=shortClock(pomoSeconds());const pp=$('#pomoPhase');if(pp)pp.textContent=state.pomo.phase==='focus'?'집중 시간':'휴식 시간';if(state.pomo.running&&state.pomo.endsAt<=Date.now()){let guard=0;while(state.pomo.running&&state.pomo.endsAt<=Date.now()&&guard++<50){const ended=state.pomo.phase;if(ended==='focus'){state.pomo.phase='break'}else{state.pomo.phase='focus';state.pomo.cycles=(state.pomo.cycles||0)+1}const duration=(state.pomo.phase==='focus'?Number(state.settings.pomoFocus):Number(state.settings.pomoBreak))*60000;state.pomo.endsAt+=duration}save();if(navigator.vibrate)navigator.vibrate([120,60,120]);render()}}
    function persistMonthField(el){const p=planForMonth(monthShowing);if(el.id==='monthGoal')p.goal=el.value;else if(el.dataset.monthReview)p.review=el.value;else if(el.dataset.monthHours){p.subjects[el.dataset.monthHours]={...(p.subjects[el.dataset.monthHours]||{}),hours:el.value}}else if(el.dataset.monthContent){p.subjects[el.dataset.monthContent]={...(p.subjects[el.dataset.monthContent]||{}),content:el.value}}save()}
    function persistWeekField(el){const p=planForWeek(mondayKey(selectedDate));if(el.id==='weekGoal')p.goal=el.value;else if(el.dataset.weekHours)p.subjects[el.dataset.weekHours]=el.value;save()}
    function moveMonth(n){const [y,m]=monthShowing.split('-').map(Number),d=new Date(y,m-1+n,1);monthShowing=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;render()}
    document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;if(page==='month')monthShowing=monthKey(selectedDate);render();return}if(b.hasAttribute('data-add-task')){taskModal(null,selectedDate);return}if(b.dataset.addTaskFor){taskModal(null,b.dataset.addTaskFor);return}if(b.dataset.editTask){taskModal(b.dataset.editTask);return}if(b.dataset.toggleTask){const t=state.tasks.find(x=>x.id===b.dataset.toggleTask);if(t){t.done=!t.done;save();render()}return}if(b.dataset.monthShift){moveMonth(Number(b.dataset.monthShift));return}if(b.dataset.date){selectedDate=b.dataset.date;if(page==='month')monthShowing=monthKey(selectedDate);page=page==='month'?'day':page;render();return}if(b.dataset.weekShift){selectedDate=addDays(selectedDate,Number(b.dataset.weekShift));render();return}if(b.hasAttribute('data-week-today')){selectedDate=keyOf(new Date());render();return}if(b.dataset.dayShift){selectedDate=addDays(selectedDate,Number(b.dataset.dayShift));render();return}if(b.hasAttribute('data-day-today')){selectedDate=keyOf(new Date());render();return}if(b.hasAttribute('data-study-toggle')){state.study.runningAt?endStudy():(state.study.runningAt=Date.now(),save(),render());return}if(b.hasAttribute('data-pomo-toggle')){startPomo();return}if(b.hasAttribute('data-pomo-reset')){resetPomo();return}if(b.hasAttribute('data-add-subject')){subjectModal();return}if(b.dataset.editSubject){subjectModal(b.dataset.editSubject);return}if(b.dataset.deleteSubject){if(confirm('이 과목을 삭제할까요? 연결된 공부 계획은 과목 없음으로 남습니다.')){state.subjects=state.subjects.filter(s=>s.id!==b.dataset.deleteSubject);state.tasks.forEach(t=>{if(t.subjectId===b.dataset.deleteSubject)t.subjectId='' });Object.values(state.months).forEach(m=>delete m.subjects[b.dataset.deleteSubject]);Object.values(state.weeks).forEach(w=>delete w.subjects[b.dataset.deleteSubject]);save();render()}return}if(b.hasAttribute('data-add-fixed')){fixedModal();return}if(b.dataset.deleteFixed){state.settings.fixed=state.settings.fixed.filter(x=>x.id!==b.dataset.deleteFixed);save();render();return}if(b.dataset.removeTask){state.tasks=state.tasks.filter(t=>t.id!==b.dataset.removeTask);save();closeModal();render();return}if(b.hasAttribute('data-close-modal')){closeModal();return}if(b.hasAttribute('data-install')||b.id==='installBtn'){if(deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.finally(()=>{deferredInstall=null;$('#installBtn').hidden=true})}return}});
    document.addEventListener('input',e=>{const el=e.target;if(el.id==='monthGoal'||el.dataset.monthHours||el.dataset.monthContent||el.dataset.monthReview)persistMonthField(el);if(el.id==='weekGoal'||el.dataset.weekHours)persistWeekField(el)});
    document.addEventListener('change',e=>{const el=e.target;if(el.dataset.availability!=null){state.settings.availability[Number(el.dataset.availability)]=Number(el.value)||0;save();render()}else if(el.hasAttribute('data-exam-date')){state.settings.examDate=el.value;save();render()}else if(el.dataset.pomoSetting){state.settings[el.dataset.pomoSetting]=Math.max(1,Number(el.value)||1);save();render()}else if(el.id==='monthGoal'||el.dataset.monthHours||el.dataset.monthContent)persistMonthField(el);else if(el.id==='weekGoal'||el.dataset.weekHours)persistWeekField(el)});
    document.addEventListener('submit',e=>{e.preventDefault();const form=e.target,fd=new FormData(form);if(form.id==='taskForm'){const id=fd.get('id'),task={id:id||crypto.randomUUID(),title:String(fd.get('title')).trim(),subjectId:fd.get('subjectId'),date:fd.get('date'),start:fd.get('start'),end:fd.get('end'),estimate:Number(fd.get('estimate'))||0,done:id?!!state.tasks.find(t=>t.id===id)?.done:false};if(task.start&&!task.end||!task.start&&task.end){toast('시작과 종료 시간을 모두 입력하거나 둘 다 비워 주세요.');return}if(task.start&&task.end&&timeMin(task.end)<=timeMin(task.start)){toast('종료 시간은 시작 시간보다 뒤여야 합니다.');return}const idx=state.tasks.findIndex(t=>t.id===id);if(idx>=0)state.tasks[idx]=task;else state.tasks.push(task);selectedDate=task.date;save();closeModal();render();return}if(form.id==='subjectForm'){const id=fd.get('id'),name=String(fd.get('name')).trim();if(!name)return;const existing=state.subjects.find(s=>s.id===id);if(existing)existing.name=name;else state.subjects.push({id:crypto.randomUUID(),name,color:colors[state.subjects.length%colors.length]});save();closeModal();render();return}if(form.id==='fixedForm'){const f={id:crypto.randomUUID(),day:Number(fd.get('day')),title:String(fd.get('title')).trim(),start:fd.get('start'),end:fd.get('end')};if(timeMin(f.end)<=timeMin(f.start)){toast('종료 시간은 시작 시간보다 뒤여야 합니다.');return}state.settings.fixed.push(f);save();closeModal();render()}});
    $('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
    document.addEventListener('click',e=>{const b=e.target.closest('button[data-date]');if(!b)return;if(page==='month')monthShowing=monthKey(b.dataset.date);selectedDate=b.dataset.date;page='day';render();e.stopImmediatePropagation()},true);
    document.addEventListener('click',e=>{const b=e.target.closest('[data-edit-fixed]');if(b)fixedModal(b.dataset.editFixed)});
    document.addEventListener('change',e=>{const el=e.target;if(!el.dataset.toggleTask)return;const t=state.tasks.find(x=>x.id===el.dataset.toggleTask);if(t){t.done=el.checked;save();render()}});
    document.addEventListener('submit',e=>{const form=e.target;if(form.id!=='subjectForm')return;e.preventDefault();e.stopImmediatePropagation();const fd=new FormData(form),id=fd.get('id'),name=String(fd.get('name')).trim(),priority=fd.get('priority')||'normal';if(!name)return;const existing=state.subjects.find(s=>s.id===id);if(existing){existing.name=name;existing.priority=priority}else state.subjects.push({id:crypto.randomUUID(),name,priority,color:colors[state.subjects.length%colors.length]});save();closeModal();render()},true);
    document.addEventListener('submit',e=>{const form=e.target;if(form.id!=='editFixedForm')return;e.preventDefault();const fd=new FormData(form),f=state.settings.fixed.find(x=>x.id===fd.get('id'));if(!f)return;const start=fd.get('start'),end=fd.get('end');if(timeMin(end)<=timeMin(start)){toast('종료 시간은 시작 시간보다 뒤여야 합니다.');return}f.day=Number(fd.get('day'));f.title=String(fd.get('title')).trim();f.start=start;f.end=end;save();closeModal();render()});
    window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;$('#installBtn').hidden=false});
    window.addEventListener('appinstalled',()=>{$('#installBtn').hidden=true;toast('앱 설치가 완료되었습니다.')});
    setInterval(refreshLive,1000);
    if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
    render();
  })();
  </script>
</body>
</html>
