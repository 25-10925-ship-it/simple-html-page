  <script>
  (() => {
    'use strict';
    const KEY = 'oneul-study-planner-v1';
    const weekdays = ['일','월','화','수','목','금','토'];
    const colors = ['#6878df','#8a9bc8','#e39c42','#c7688b','#4a99c3','#8a70c5','#9b8c53'];
    const gradeSubjects = [{id:'korean',name:'국어',color:'#8fa9ff'},{id:'math',name:'수학',color:'#ff9d75'},{id:'english',name:'영어',color:'#69d3bd'},{id:'history',name:'한국사',color:'#e5bd67'},{id:'inquiry1',name:'탐구 1',color:'#d39be8'},{id:'inquiry2',name:'탐구 2',color:'#78c8e8'}];
    const fresh = () => ({
      settings:{examDate:'2027-11-18',availability:[0,0,0,0,0,0,0],fixed:[],pomoFocus:25,pomoBreak:5},
      subjects:[],months:{},weeks:{},tasks:[],dayOverrides:{},calendarEvents:{},ddays:[],examResults:[],study:{totals:{},runningAt:null},
      pomo:{phase:'focus',running:false,endsAt:null,remainingMs:null,cycles:0},
      timer:{duration:1500,running:false,endsAt:null,remainingMs:null}
    });
    function load(){try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(!raw)return fresh();const base=fresh();return {...base,...raw,settings:{...base.settings,...(raw.settings||{})},study:{...base.study,...(raw.study||{})},pomo:{...base.pomo,...(raw.pomo||{})},timer:{...base.timer,...(raw.timer||{})},calendarEvents:raw.calendarEvents&&typeof raw.calendarEvents==='object'&&!Array.isArray(raw.calendarEvents)?raw.calendarEvents:{},ddays:Array.isArray(raw.ddays)?raw.ddays:[],examResults:Array.isArray(raw.examResults)?raw.examResults.filter(item=>item&&typeof item.id==='string'&&typeof item.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(item.date)&&typeof item.title==='string'&&item.grades&&typeof item.grades==='object'&&!Array.isArray(item.grades)):[],dayOverrides:raw.dayOverrides&&typeof raw.dayOverrides==='object'&&!Array.isArray(raw.dayOverrides)?raw.dayOverrides:{}}}catch(_){return fresh()}}
    let state = load();
    let page = 'home';
    let selectedDate = keyOf(new Date());
    let monthShowing = selectedDate.slice(0,7);
    let deferredInstall = null;
    let modalReturnWeekday = null;
    let activeTimePicker = null;
    let activeDatePicker = null;
    const $ = s => document.querySelector(s);
    const esc = v => String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(_){toast('저장 공간을 사용할 수 없습니다. 브라우저 설정을 확인해 주세요.')}}
    function keyOf(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
    function fromKey(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
    function addDays(k,n){const d=fromKey(k);d.setDate(d.getDate()+n);return keyOf(d)}
    function monthKey(k){return k.slice(0,7)}
    function mondayKey(k){const d=fromKey(k);return addDays(k,d.getDay()===0?1:1-d.getDay())}
    function dateLabel(k,withYear=true){const d=fromKey(k);return `${withYear?`${d.getFullYear()}년 `:''}${d.getMonth()+1}월 ${d.getDate()}일 (${weekdays[d.getDay()]})`}
    function dateDifference(dateKey,baseKey=keyOf(new Date())){const [y1,m1,d1]=dateKey.split('-').map(Number),[y2,m2,d2]=baseKey.split('-').map(Number);return Math.round((Date.UTC(y1,m1-1,d1)-Date.UTC(y2,m2-1,d2))/86400000)}
    function ddayText(dateKey,baseKey=keyOf(new Date())){const days=dateDifference(dateKey,baseKey);return days>0?`D-${days}`:days===0?'D-day':`D+${Math.abs(days)}`}
    let ddayPrunedDate='';
    function pruneExpiredDdays(){const today=keyOf(new Date());if(ddayPrunedDate===today)return false;ddayPrunedDate=today;const valid=state.ddays.filter(item=>item&&typeof item.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(item.date)&&item.date>=today);if(valid.length===state.ddays.length)return false;state.ddays=valid;save();return true}
    function createId(){return globalThis.crypto?.randomUUID?.()||`item-${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`}
    function monthLabel(k){const [y,m]=k.split('-').map(Number);return `${y}년 ${m}월`}
    function hours(min){const h=Math.floor(min/60),m=min%60;return h?`${h}시간${m?` ${m}분`:''}`:`${m}분`}
    function clock(sec){sec=Math.max(0,Math.floor(sec));return `${String(Math.floor(sec/3600)).padStart(2,'0')}:${String(Math.floor(sec%3600/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
    function shortClock(sec){sec=Math.max(0,Math.floor(sec));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
    function timeMin(t){if(!t)return null;const [h,m]=t.split(':').map(Number);return h*60+m}
    function taskMinutes(t){if(t.start&&t.end){let a=timeMin(t.start),b=timeMin(t.end);if(b<a)b+=1440;return b-a}return Math.max(0,Number(t.estimate)||0)}
    function allOn(k){return state.tasks.filter(t=>t.date===k).sort((a,b)=>(a.start||'99:99').localeCompare(b.start||'99:99'))}
    function hasDayOverride(k){return Object.prototype.hasOwnProperty.call(state.dayOverrides,k)}
    function ensureDayOverride(k){let override=state.dayOverrides[k];if(Array.isArray(override)){const base=allOn(k),baseById=new Map(base.map(t=>[t.id,t])),seen=new Set(),tasks=[],removed=[],done={};for(const task of override){seen.add(task.id);const source=baseById.get(task.id);if(!source)tasks.push({...task,local:true});else{const patch={};for(const key of ['title','subjectId','date','start','end','estimate'])if((task[key]??'')!==(source[key]??''))patch[key]=task[key];if(Object.keys(patch).length)tasks.push({id:task.id,patch});if(!!task.done!==!!source.done)done[task.id]=!!task.done}}for(const task of base)if(!seen.has(task.id))removed.push(task.id);override={tasks,removed,done}}if(!override||typeof override!=='object')override={};if(!Array.isArray(override.tasks))override.tasks=[];if(!Array.isArray(override.removed))override.removed=[];if(!override.done||typeof override.done!=='object'||Array.isArray(override.done))override.done={};for(const task of override.tasks){if(task.subjectId&&!subjectById(task.subjectId))task.subjectId='';if(task.patch?.subjectId&&!subjectById(task.patch.subjectId))task.patch.subjectId=''}state.dayOverrides[k]=override;return override}
    function dayOn(k){const base=allOn(k);if(!hasDayOverride(k))return base;const override=ensureDayOverride(k),replacements=new Map(override.tasks.map(t=>[t.id,t])),removed=new Set(override.removed),tasks=base.filter(t=>!removed.has(t.id)).map(t=>{const entry=replacements.get(t.id);return entry?.local?{...entry}:{...t,...(entry?.patch||{})}}),included=new Set(tasks.map(t=>t.id));for(const entry of override.tasks)if(entry.local&&!included.has(entry.id)&&!removed.has(entry.id)){const {local,...task}=entry;tasks.push({...task})}for(const task of tasks)if(Object.prototype.hasOwnProperty.call(override.done,task.id))task.done=override.done[task.id];return tasks.sort((a,b)=>(a.start||'99:99').localeCompare(b.start||'99:99'))}
    function setDayTask(k,task){const override=ensureDayOverride(k),base=allOn(k).find(t=>t.id===task.id),index=override.tasks.findIndex(t=>t.id===task.id);if(base){const patch={};for(const key of ['title','subjectId','date','start','end','estimate'])if((task[key]??'')!==(base[key]??''))patch[key]=task[key];if(Object.keys(patch).length){const entry={id:task.id,patch};if(index<0)override.tasks.push(entry);else override.tasks[index]=entry}else if(index>=0)override.tasks.splice(index,1)}else{const local={...task,local:true};if(index<0)override.tasks.push(local);else override.tasks[index]=local}override.removed=override.removed.filter(id=>id!==task.id);if(!Object.prototype.hasOwnProperty.call(override.done,task.id)&&(!base||!!task.done!==!!base.done))override.done[task.id]=!!task.done;if(!override.tasks.length&&!override.removed.length&&!Object.keys(override.done).length)delete state.dayOverrides[k]}
    function removeDayTask(k,id){const override=ensureDayOverride(k);if(allOn(k).some(t=>t.id===id)){if(!override.removed.includes(id))override.removed.push(id);override.tasks=override.tasks.filter(t=>t.id!==id)}else override.tasks=override.tasks.filter(t=>t.id!==id);delete override.done[id]}
    function taskInScope(id,k,scope){return (scope==='day'?dayOn(k):allOn(k)).find(t=>t.id===id)}
    function setTaskDone(id,k,scope,done){if(scope==='day'){if(dayOn(k).some(t=>t.id===id))ensureDayOverride(k).done[id]=done}else{const t=state.tasks.find(x=>x.id===id);if(t)t.done=done}save();render()}
    function planForMonth(k){if(!state.months[k])state.months[k]={goal:'',subjects:{}};return state.months[k]}
    function planForWeek(k){if(!state.weeks[k])state.weeks[k]={goal:'',subjects:{}};return state.weeks[k]}
    function subjectById(id){return state.subjects.find(s=>s.id===id)}
    function fixedFor(k){const dow=fromKey(k).getDay();return state.settings.fixed.filter(x=>Number(x.day)===dow).sort((a,b)=>a.start.localeCompare(b.start))}
    function dayTotal(k){let total=Number(state.study.totals[k]||0);if(state.study.runningAt){const start=Number(state.study.runningAt),now=Date.now(),d=fromKey(k),a=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime(),b=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime();total+=Math.max(0,Math.min(now,b)-Math.max(start,a))/1000}return Math.floor(total)}
    function plannedFor(k){return dayOn(k).reduce((n,t)=>n+taskMinutes(t),0)}
    function weekDates(k){const start=addDays(k,-fromKey(k).getDay());return Array.from({length:7},(_,i)=>addDays(start,i))}
    function subjectHoursMap(tasks){const out={};for(const t of tasks)out[t.subjectId]=(out[t.subjectId]||0)+taskMinutes(t);return out}
    function taskConflicts(k){const tasks=dayOn(k).filter(t=>t.start&&t.end);const fixed=fixedFor(k);let msgs=[];for(let i=0;i<tasks.length;i++){const a=tasks[i],[as,ae]=timelineMinuteRange(a.start,a.end);for(let j=i+1;j<tasks.length;j++){const b=tasks[j],[bs,be]=timelineMinuteRange(b.start,b.end);if(as<be&&bs<ae)msgs.push(`공부 일정 “${a.title}”과 “${b.title}” 시간이 겹칩니다.`)}for(const f of fixed){const [fs,fe]=timelineMinuteRange(f.start,f.end);if(as<fe&&fs<ae)msgs.push(`공부 일정 “${a.title}”이 고정 일정 “${f.title}”과 겹칩니다.`)}}return [...new Set(msgs)]}
    function toast(text){const el=$('#toast');el.textContent=text;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2400)}
    function pageInfo(){return {home:['오늘의 계획','오늘 공부할 것'],month:['수능까지의 흐름','월간 계획'],week:['이번 주 계획','주간 계획'],day:['시간표와 실행','일간 시간표'],grades:['성적 기록과 추이','성적 분석'],settings:['내 플래너 설정','과목 및 설정']}[page]}
    function nav(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const [e,t]=pageInfo();$('#pageEyebrow').textContent=e;$('#pageTitle').textContent=t;$('#headerDate').textContent=dateLabel(keyOf(new Date()))}
     function render(){
       pruneExpiredDdays();
       nav();
       const view=$('#pageView');
       view.innerHTML=page==='home'?renderHome():page==='month'?renderMonthEnhanced():page==='week'?renderWeekHorizontal():page==='day'?renderDayTimeline():page==='grades'?renderGrades():renderSettings();
       if(page==='month'){
         const description=$('.calendar-card .section-head p');
         if(description)description.textContent='공휴일, 중요 일정, 공부 계획을 한눈에 확인합니다.';
         document.querySelectorAll('.cal-day-open').forEach(button=>button.setAttribute('aria-label',dateLabel(button.dataset.date,false)+' · 상세 일정'));
       }
